[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-reconstruction"
version = "0.1.0"
description = "Antenna Reconstruction Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sympy>=1.12",
    "ezdxf>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
