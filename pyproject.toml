[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-reconstruction"
version = "0.1.0"
description = "Antenna Reconstruction Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sympy>=1.12",
    "ezdxf>=1.1.0",
    "shapely>=2.0.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
antenna-reconstruct = "antenna_reconstruction.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "pypdfium2>=4.0.0",
]
